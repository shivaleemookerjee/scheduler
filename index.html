<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Routine Planner Pro</title>
<style>
body{font-family:Inter,Segoe UI;background:#0f172a;color:#fff;margin:0}
.container{max-width:1100px;margin:auto;padding:20px}
h1{text-align:center;font-size:28px}
.card{background:#1e293b;border-radius:16px;padding:18px;margin:15px 0}
input,select{padding:10px;border-radius:8px;border:none;margin:5px}
button{padding:10px 14px;border:none;border-radius:8px;background:#22c55e;color:#000;font-weight:bold;cursor:pointer}
.task{display:flex;justify-content:space-between;align-items:center;background:#334155;padding:10px;border-radius:10px;margin:6px 0}
.left{display:flex;flex-direction:column}
.time{font-size:12px;opacity:.7}
.priority-high{border-left:5px solid #ef4444}
.priority-medium{border-left:5px solid #f59e0b}
.priority-low{border-left:5px solid #22c55e}
</style>
</head>
<body>
<div class="container">
<h1>🤖 AI Routine Planner Pro</h1>

<div class="card">
<h3>Add Task</h3>
<input id="task-text" placeholder="Task">
<input id="task-time" type="time">
<select id="task-priority">
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select>
<select id="task-type">
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
</select>
<button onclick="addTask()">Add</button>
</div>

<div class="card">
<h3>🤖 AI Generate Routine</h3>
<input id="goal-input" placeholder="Enter goal (e.g. lose weight, learn coding)">
<button onclick="generateAI()">Generate</button>
</div>

<div class="card">
<h3>Tasks</h3>
<div id="task-list"></div>
</div>
</div>

<script>
function getTasks(){return JSON.parse(localStorage.getItem('tasks')||'[]')}
function saveTasks(t){localStorage.setItem('tasks',JSON.stringify(t))}

function addTask(){
const text=document.getElementById('task-text').value
const time=document.getElementById('task-time').value
const priority=document.getElementById('task-priority').value
const type=document.getElementById('task-type').value

if(!text) return

const tasks=getTasks()
tasks.push({text,time,priority,type,done:false})
saveTasks(tasks)
render()
}

function toggle(i){const t=getTasks();t[i].done=!t[i].done;saveTasks(t);render()}
function del(i){const t=getTasks();t.splice(i,1);saveTasks(t);render()}

function render(){
const list=document.getElementById('task-list')
list.innerHTML=''
getTasks().forEach((t,i)=>{
const div=document.createElement('div')
div.className='task priority-'+t.priority

div.innerHTML=`
<div class="left">
<b>${t.text}</b>
<span class="time">${t.time||''} • ${t.type}</span>
</div>
<div>
<input type="checkbox" ${t.done?'checked':''} onclick="toggle(${i})">
<button onclick="del(${i})">❌</button>
</div>
`
list.appendChild(div)
})
}

function generateAI(){
const goal=document.getElementById('goal-input').value.toLowerCase()
let suggestions=[]

if(goal.includes('weight')){
suggestions=[
{t:'Workout',time:'07:00',p:'high',type:'daily'},
{t:'Healthy diet',time:'13:00',p:'high',type:'daily'},
{t:'Track calories',time:'21:00',p:'medium',type:'daily'}
]
}
else if(goal.includes('coding')){
suggestions=[
{t:'DSA practice',time:'10:00',p:'high',type:'daily'},
{t:'Build project',time:'15:00',p:'high',type:'daily'},
{t:'Learn theory',time:'20:00',p:'medium',type:'daily'}
]
}
else{
suggestions=[
{t:'Focus work',time:'10:00',p:'high',type:'daily'},
{t:'Skill learning',time:'18:00',p:'medium',type:'daily'}
]
}

const tasks=getTasks()
suggestions.forEach(s=>tasks.push({text:s.t,time:s.time,priority:s.p,type:s.type,done:false}))
saveTasks(tasks)
render()
}

render()
</script>
</body>
</html>
