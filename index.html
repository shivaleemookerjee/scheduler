<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Planner ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter;background:radial-gradient(circle at top,#1e293b,#020617);color:#fff}
.app{display:flex;height:100vh}
.sidebar{width:260px;background:rgba(255,255,255,0.03);backdrop-filter:blur(25px);padding:20px;border-right:1px solid rgba(255,255,255,0.1)}
.sidebar h2{margin-bottom:25px}
.sidebar button{width:100%;margin:8px 0;padding:12px;border:none;border-radius:14px;background:rgba(255,255,255,0.05);color:#fff;cursor:pointer;transition:.3s}
.sidebar button:hover{background:linear-gradient(135deg,#22c55e,#4ade80);color:#000;transform:translateX(6px)}
.main{flex:1;padding:30px;overflow:auto}
.card{background:rgba(255,255,255,0.04);backdrop-filter:blur(25px);border-radius:22px;padding:25px;margin-bottom:25px;box-shadow:0 15px 50px rgba(0,0,0,0.5);transition:.3s}
.card:hover{transform:translateY(-6px) scale(1.01)}
h2{margin-top:0}
input,select{padding:12px;border-radius:12px;border:none;margin:8px 0;width:100%;background:#020617;color:#fff}
button.primary{background:linear-gradient(135deg,#22c55e,#4ade80);color:#000;font-weight:600;padding:12px;border:none;border-radius:12px;width:100%;transition:.3s}
button.primary:hover{transform:scale(1.05);box-shadow:0 0 20px #22c55e}
.task{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:14px;border-radius:14px;margin:10px 0;transition:.3s}
.task:hover{transform:scale(1.02);background:rgba(255,255,255,0.08)}
.meta{font-size:12px;opacity:.7}
.high{border-left:5px solid #ef4444}
.medium{border-left:5px solid #f59e0b}
.low{border-left:5px solid #22c55e}
.calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.slot{background:rgba(255,255,255,0.05);padding:25px;border-radius:16px;text-align:center;cursor:pointer;transition:.3s}
.slot:hover{background:linear-gradient(135deg,#22c55e,#4ade80);color:#000;transform:scale(1.05)}
.progress{height:12px;background:#111;border-radius:20px;margin-top:12px}
.bar{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stat{background:rgba(255,255,255,0.05);padding:15px;border-radius:14px;text-align:center}
</style>
</head>
<body>
<div class="app">

<div class="sidebar">
<h2>✨ Elite Planner</h2>
<button onclick="view='dashboard';render()">📊 Dashboard</button>
<button onclick="view='tasks';render()">✅ Tasks</button>
<button onclick="view='calendar';render()">📅 Planner</button>
<button onclick="view='ai';render()">🤖 AI</button>
</div>

<div class="main" id="main"></div>

</div>

<script>
let view='dashboard'

function get(){return JSON.parse(localStorage.getItem('tasks')||'[]')}
function save(t){localStorage.setItem('tasks',JSON.stringify(t))}

function addTask(){
const text=document.getElementById('text').value
const time=document.getElementById('time').value
const priority=document.getElementById('priority').value
if(!text) return
const t=get();t.push({text,time,priority,done:false});save(t);render()
}

function toggle(i){const t=get();t[i].done=!t[i].done;save(t);render()}
function del(i){const t=get();t.splice(i,1);save(t);render()}

function dashboard(){
const t=get();const done=t.filter(x=>x.done).length
const percent=t.length?Math.round(done/t.length*100):0
return `<div class='card'>
<h2>📊 Productivity Dashboard</h2>
<div class='grid'>
<div class='stat'>Tasks<br><b>${t.length}</b></div>
<div class='stat'>Completed<br><b>${done}</b></div>
<div class='stat'>Score<br><b>${percent}%</b></div>
</div>
<div class='progress'><div class='bar' style='width:${percent}%'></div></div>
</div>`
}

function tasks(){
let html=`<div class='card'>
<h2>Add Task</h2>
<input id='text' placeholder='Task'>
<input id='time' type='time'>
<select id='priority'>
<option value='high'>🔥 High</option>
<option value='medium'>⚡ Medium</option>
<option value='low'>🌿 Low</option>
</select>
<button class='primary' onclick='addTask()'>➕ Add Task</button>
</div>`

html+=`<div class='card'><h2>Your Tasks</h2>`
get().forEach((t,i)=>{
html+=`<div class='task ${t.priority}'>
<div>
<b>${t.text}</b>
<div class='meta'>${t.time||''} • ${t.priority}</div>
</div>
<div>
<input type='checkbox' ${t.done?'checked':''} onclick='toggle(${i})'>
<button onclick='del(${i})'>❌</button>
</div>
</div>`
})
html+='</div>'
return html
}

function calendar(){
let html="<div class='card'><h2>📅 Planner</h2><div class='calendar'>"
for(let i=1;i<=12;i++) html+=`<div class='slot'>Slot ${i}</div>`
html+='</div></div>'
return html
}

function ai(){
return `<div class='card'>
<h2>🤖 AI Planner</h2>
<input id='goal' placeholder='e.g. weight + coding'>
<button class='primary' onclick='aiGenerate()'>Generate Plan</button>
</div>`
}

function aiGenerate(){
const goal=document.getElementById('goal').value.toLowerCase()
let plan=[]
if(goal.includes('weight')) plan.push({text:'Workout',time:'07:00',priority:'high'})
if(goal.includes('coding')) plan.push({text:'DSA Practice',time:'10:00',priority:'high'})
const t=get();plan.forEach(p=>t.push({...p,done:false}));save(t);render()
}

function render(){
let html=''
if(view==='dashboard') html=dashboard()
if(view==='tasks') html=tasks()
if(view==='calendar') html=calendar()
if(view==='ai') html=ai()

document.getElementById('main').innerHTML=html
}

render()
</script>
</body>
</html>
